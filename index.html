<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Luplex</title>
<script>
(function () {
  var m = null;
  try { m = localStorage.getItem('theme'); } catch (e) { m = null; }
  if (m !== 'light' && m !== 'dark') {
    m = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', m);
  try {
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    if (mq.addEventListener) {
      mq.addEventListener('change', function (ev) {
        var s = null;
        try { s = localStorage.getItem('theme'); } catch (e2) { s = null; }
        if (s !== 'light' && s !== 'dark') { document.documentElement.setAttribute('data-theme', ev.matches ? 'light' : 'dark'); }
      });
    }
  } catch (e3) { /* no system theme events */ }
}());
</script>
<style>
:root{--bg:#0b1220;--card:#121c30;--card2:#18243d;--text:#e8eefc;--muted:#93a1bd;--accent:#19c3a6;--accent2:#ff8a3d;--danger:#ff5a6a;--border:#24324f;--radius:16px}
:root[data-theme="light"]{--bg:#f4f6fb;--card:#ffffff;--card2:#eaeef7;--text:#101828;--muted:#5b6b86;--border:#d5dcec}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;font-size:16px}
body{padding-top:env(safe-area-inset-top)}
#app{max-width:720px;margin:0 auto;padding:12px 14px 110px}
h1,h2,h3,p{margin:0}
h1{font-size:22px}
h2{font-size:18px;margin:16px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin:10px 0}
.card.click{cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
input,select,textarea{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:16px;font-family:inherit}
textarea{min-height:120px;resize:vertical}
label{display:block;margin:12px 0 4px;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#04201b;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px;cursor:pointer}
.btn.small{padding:8px 12px;font-size:14px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.warn{background:var(--accent2);color:#2a1300}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;margin:6px 0}
.chip{display:inline-flex;align-items:center;white-space:nowrap;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:#04201b;border-color:var(--accent);font-weight:700}
.searchbar{display:flex;gap:8px}
.listing img{width:100%;height:170px;object-fit:cover;border-radius:12px;background:var(--card2);display:block;margin-bottom:8px}
.price{font-weight:800;color:var(--accent)}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);margin-inline-start:6px}
.badge.off{border-color:var(--muted);color:var(--muted)}
.gallery{display:flex;gap:8px;overflow-x:auto}
.gallery img{height:220px;border-radius:12px;flex:0 0 auto;background:var(--card2)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;color:var(--muted);font-size:12px;padding:4px 10px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav .ic{width:26px;height:26px;margin:0}
nav button.on{color:var(--accent2);font-weight:700}
.fab{display:flex;align-items:center;position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));inset-inline-end:16px;background:var(--accent2);color:#2a1300;border:0;border-radius:999px;padding:14px 18px;font-weight:800;z-index:4}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#000c;color:#fff;border:1px solid var(--border);padding:10px 16px;border-radius:12px;max-width:90%;z-index:20;display:none;text-align:center}
#offline{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;gap:12px}
#offline[hidden]{display:none}
.msg{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:85%;background:var(--card2);word-wrap:break-word}
.msg.me{background:var(--accent);color:#04201b;margin-inline-start:auto}
.pre{white-space:pre-wrap;line-height:1.5}
.sp{height:8px}
.range2{display:flex;gap:10px;align-items:center}
.range2 input{padding:0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.bad{color:var(--danger)}
.ic{width:18px;height:18px;margin-inline-end:6px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.btn.small .ic{width:16px;height:16px;margin-inline-end:5px}
.imgwrap{position:relative}
.heart{position:absolute;top:10px;inset-inline-end:10px;width:42px;height:42px;border-radius:50%;border:0;background:#0b1220cc;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:2}
.heart .ic{width:22px;height:22px;margin:0}
.heart.on{color:var(--danger)}
.heart.on .ic{fill:currentColor}
[dir=rtl] .flip{transform:scaleX(-1)}
.spin-wrap{display:flex;justify-content:center;padding:56px 0}
.spinner{width:48px;height:48px;border-radius:50%;border:5px solid var(--border);border-top-color:var(--accent);border-right-color:var(--accent2);animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 12px 8px;gap:8px}
.empty-art{width:min(260px,70%);height:auto;margin-bottom:6px}
.empty h2{margin:6px 0 0;font-size:20px}
.empty .btn{margin-top:10px}
.dt{display:inline-flex;align-items:center}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.slides::-webkit-scrollbar{display:none}
.listing .slides img,.slides img{flex:0 0 100%;width:100%;height:170px;object-fit:cover;scroll-snap-align:center;border-radius:0;margin:0;display:block}
.listing .imgwrap{margin-bottom:8px}
.imgwrap.tall .slides img{height:250px}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots span{width:7px;height:7px;border-radius:50%;background:#ffffff66}
.dots span.on{background:#fff}
.count{position:absolute;bottom:10px;right:10px;background:#0b1220cc;color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;direction:ltr}
.feat{position:absolute;top:10px;inset-inline-start:10px;background:var(--accent2);color:#2a1300;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px;z-index:2;display:inline-flex;align-items:center}
.feat .ic{width:14px;height:14px;margin-inline-end:4px;fill:currentColor}
.dt .ic{width:14px;height:14px;margin-inline-end:4px}
.good{color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="offline" hidden><h2 id="offTitle"></h2><p class="muted" id="offMsg"></p><button class="btn" id="offRetry"></button></div>
<script>
(function () {
  function show(msg) {
    var b = document.getElementById('diag');
    if (!b) {
      b = document.createElement('div');
      b.id = 'diag';
      b.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ff5a6a;color:#fff;font:13px system-ui,sans-serif;padding:8px 12px;z-index:100;direction:ltr;text-align:left';
      document.body.appendChild(b);
    }
    var line = document.createElement('div');
    line.textContent = String(msg);
    b.appendChild(line);
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'SCRIPT') { show('Missing file: ' + (t.getAttribute('src') || '')); }
    else { show('Error: ' + (e.message || 'unknown') + (e.filename ? ' (' + e.filename.split('/').pop() + ')' : '')); }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    show('Error: ' + ((e.reason && e.reason.message) || e.reason));
  });
}());
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="i18n_en.js"></script>
<script src="i18n_ar.js"></script>
<script src="app_icons.js"></script>
<script src="app_core.js"></script>
<script src="app_views1.js"></script>
<script src="app_views2.js"></script>

</body>
</html>
